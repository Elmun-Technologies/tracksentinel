# TrackSentinel — Production Docker Compose (Hetzner)
# Services bind to 127.0.0.1 — Nginx proxies externally.

services:
  postgres:
    image: postgres:16-alpine
    container_name: tracksentinel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tracksentinel}
      POSTGRES_USER: ${POSTGRES_USER:-tracksentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    expose:
      - "5432"
    volumes:
      - tracksentinel_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracksentinel}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tracksentinel_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  web:
    image: ${DOCKER_REGISTRY:-ghcr.io}/elmun-technologies/tracksentinel-web:${VERSION:-latest}
    container_name: tracksentinel_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - /opt/tracksentinel/.env.production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tracksentinel_net
    mem_limit: 512m
    cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  worker:
    image: ${DOCKER_REGISTRY:-ghcr.io}/elmun-technologies/tracksentinel-worker:${VERSION:-latest}
    container_name: tracksentinel_worker
    restart: unless-stopped
    expose:
      - "9090"
    env_file:
      - /opt/tracksentinel/.env.production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tracksentinel_net
    shm_size: 256m
    mem_limit: 1g
    cpus: "1.5"
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

volumes:
  tracksentinel_postgres_data:
    name: tracksentinel_postgres_data

networks:
  tracksentinel_net:
    name: tracksentinel_net
    driver: bridge
